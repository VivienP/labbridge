[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labbridge"
version = "0.1.0"
description = "Experimental-data infrastructure and fault-aware campaign runtime for electrochemical R&D."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vivien Perrelle" }]
keywords = [
    "experimental-data-infrastructure",
    "electrochemistry",
    "autonomous-lab",
    "provenance",
    "fault-tolerance",
    "multi-fidelity",
    "materials-discovery",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",      # thin surrogate / baselines only — this is not an ML project
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",        # structured JSON logging / observability
    "httpx>=0.27",            # data fetch in scripts/
    "pyyaml>=6.0",            # durable campaign.yaml
    "sqlalchemy>=2.0",        # operational state (ADR-001)
    "alembic>=1.13",          # migrations; never bypassed (AI_CONTRACT.md section 10)
    "psycopg[binary]>=3.2",   # PostgreSQL driver
    "boto3>=1.34",            # S3-compatible object storage: MinIO locally, S3 in production
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml",
    "boto3-stubs[s3]",       # mypy --strict needs S3 stubs
    "httpx>=0.27",           # also the FastAPI TestClient transport
]

[project.scripts]
labbridge = "labbridge.cli:app"

[project.urls]
Homepage = "https://github.com/VivienP/labbridge"
Documentation = "https://github.com/VivienP/labbridge/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/labbridge"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pyarrow.*", "structlog.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "ASYNC"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these. Rewrapping generated DDL would make the file diverge from what the next
# autogenerate produces, and `alembic check` is what keeps them honest — not the line length.
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
# src layout: make the package importable without an editable install, so the offline suite runs
# from a clean checkout.
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "slow: heavier runs (a full campaign)",
    "data: requires the fetched HER dataset on disk",
    "integration: requires real PostgreSQL and/or MinIO — proves durability, not logic",
]
