# Local operation for Slice 1 (ADR-001: PostgreSQL for operational state, S3-compatible object
# storage for artifacts). Development only — no credential here is a secret, and none may be reused
# anywhere else. AI_CONTRACT.md section 11 forbids writing real secrets to a tracked file.
#
# Healthchecks are not decoration: the integration suite waits on `service_healthy`, so a test that
# fails does so because the code is wrong, not because a container was still starting.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labbridge
      POSTGRES_PASSWORD: labbridge
      POSTGRES_DB: labbridge
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labbridge -d labbridge"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: labbridge
      MINIO_ROOT_PASSWORD: labbridge-dev-only
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  minio_data:
