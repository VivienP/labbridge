# Local operation (ADR-001: PostgreSQL for operational state, S3-compatible object storage for
# artifacts). Development only — no credential here is a secret, and none may be reused anywhere
# else. AI_CONTRACT.md section 11 forbids writing real secrets to a tracked file.
#
# Every service carries a profile, so a bare `docker compose up` starts nothing: `--profile demo`
# runs the application, `--profile infrastructure` runs only the stores the integration suite needs.
#
# Healthchecks are not decoration: the integration suite waits on `service_healthy`, so a test that
# fails does so because the code is wrong, not because a container was still starting.

name: ${LABBRIDGE_COMPOSE_PROJECT:-labbridge-cv-passport-demo}

services:
  app:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      LABBRIDGE_DB_HOST: demo-postgres
      LABBRIDGE_DB_PORT: 5432
      LABBRIDGE_DB_USER: labbridge
      LABBRIDGE_DB_PASSWORD: labbridge
      LABBRIDGE_DB_NAME: labbridge
      LABBRIDGE_S3_ENDPOINT_URL: http://demo-minio:9000
      LABBRIDGE_S3_ACCESS_KEY: labbridge
      LABBRIDGE_S3_SECRET_KEY: labbridge-dev-only
      LABBRIDGE_S3_BUCKET: labbridge
    depends_on:
      demo-postgres:
        condition: service_healthy
      demo-minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "scripts/check_demo_health.py", "http://localhost:8000/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-postgres:
    profiles: ["demo"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labbridge
      POSTGRES_PASSWORD: labbridge
      POSTGRES_DB: labbridge
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labbridge -d labbridge"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-minio:
    profiles: ["demo"]
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: labbridge
      MINIO_ROOT_PASSWORD: labbridge-dev-only
    volumes:
      - demo_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    profiles: ["infrastructure"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labbridge
      POSTGRES_PASSWORD: labbridge
      POSTGRES_DB: labbridge
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labbridge -d labbridge"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    profiles: ["infrastructure"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: labbridge
      MINIO_ROOT_PASSWORD: labbridge-dev-only
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  minio_data:
  demo_postgres_data:
  demo_minio_data:
