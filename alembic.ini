; Alembic configuration. The URL is deliberately absent: migrations/env.py reads it from
; DatabaseSettings so a migration can never be pointed at a database by editing a tracked file,
; and no credential is committed (AI_CONTRACT.md section 11).

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
; UTC, sortable, and ordered on disk the way the revisions run.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
